<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Administração de usuários</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><style>.admin-shell{max-width:1000px;margin:auto;padding:28px}.admin-top{display:flex;justify-content:space-between;align-items:center}.admin-intro{padding:50px 2px 28px}.admin-intro h1{font:800 40px Manrope;letter-spacing:-2px;margin:0}.admin-intro p{color:#707683;margin:10px 0 0}.admin-grid{display:grid;grid-template-columns:330px 1fr;gap:20px}.admin-card{background:#fff;border:1px solid #dce2df;border-radius:16px;padding:22px;box-shadow:0 15px 35px rgba(25,40,30,.06)}.admin-card h2{font:700 17px Manrope;margin:0 0 18px}.admin-form{display:flex;flex-direction:column;gap:13px}.admin-form label{font-size:11px;font-weight:700;color:#555b67;display:flex;flex-direction:column;gap:6px}.admin-form input,.admin-form select{height:39px;border:1px solid #d9dee2;border-radius:7px;padding:0 10px;font:500 12px "DM Sans"}.admin-form .add-button{margin-top:5px;height:40px}.user-table{width:100%;min-width:0}.user-table th,.user-table td{background:white;height:45px;border-right:0;border-bottom:1px solid #e5e9e7;text-align:left;padding:0 8px}.user-table th{font-size:10px;color:#707683}.user-table td{font-size:12px}.role{font-size:10px;font-weight:700;padding:5px 7px;border-radius:6px;background:#eeecff;color:#6257db}.user-actions{display:flex;gap:6px}.action{border:0;border-radius:6px;padding:6px 7px;font:700 10px "DM Sans";cursor:pointer;background:#edf7ed;color:#15832a}.action.delete{background:#fff0f1;color:#cc4e5c}.admin-message{font-size:11px;min-height:15px;color:#c43d4d;margin:4px 0 0}@media(max-width:720px){.admin-shell{padding:20px 14px}.admin-grid{grid-template-columns:1fr}.admin-intro h1{font-size:32px}}</style><link rel="stylesheet" href="/help.css?v=9"><script src="/help.js?v=8" defer></script></head><body><main class="admin-shell"><header class="admin-top"><a class="brand" href="/admin"><span>✓</span> chamados</a><button type="button" id="helpButton" class="help-button" aria-label="Ajuda" title="Ajuda"><span aria-hidden="true">?</span><b>Ajuda</b></button><button id="logout" class="quiet-button">Sair</button></header><section class="admin-intro"><p class="eyebrow">ADMINISTRAÇÃO</p><h1>Usuários e permissões</h1><p>Crie, edite e remova as contas que podem acessar o sistema.</p></section><section class="admin-grid"><aside class="admin-card"><h2 id="formTitle">Criar usuário</h2><form id="userForm" class="admin-form"><input id="editingId" type="hidden"><label>Usuário<input id="newUsername" required placeholder="Ex.: joao.silva"></label><label>Senha <input id="newPassword" type="password" required placeholder="Defina uma senha"></label><label>Permissão<select id="newRole"><option value="user">Usuário</option><option value="admin">Administrador</option></select></label><p id="formMessage" class="admin-message"></p><button id="formButton" class="add-button">Criar usuário</button><button id="cancelEdit" type="button" class="quiet-button" hidden>Cancelar edição</button></form></aside><section class="admin-card"><h2>Contas criadas</h2><div class="table-scroll"><table class="user-table"><thead><tr><th>USUÁRIO</th><th>PERMISSÃO</th><th>CRIADO EM</th><th></th></tr></thead><tbody id="userRows"></tbody></table></div></section></section></main><script src="admin.js"></script></body></html>
