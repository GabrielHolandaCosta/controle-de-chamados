<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Login administrativo</title><link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>.login-page{min-height:100vh;display:grid;place-items:center;padding:22px;background:linear-gradient(145deg,#f5f7f5,#eef0fc)}.login-card{width:min(100%,430px);background:#fff;border:1px solid #dce2df;border-radius:21px;padding:36px;box-shadow:0 24px 60px rgba(25,40,30,.11);display:flex;flex-direction:column;gap:28px}.login-card h1{font:800 29px Manrope;letter-spacing:-1.3px;margin:0}.login-copy{color:#707683;font-size:14px;line-height:1.5;margin:10px 0 0}.login-card form{display:flex;flex-direction:column;gap:16px}.login-card label{font-size:12px;font-weight:700;color:#4d5260;display:flex;flex-direction:column;gap:7px}.login-card input{border:1px solid #d9dee2;height:43px;border-radius:8px;padding:0 11px;font:500 13px "DM Sans";outline:0}.login-card input:focus{border-color:#6257db;box-shadow:0 0 0 3px #eeecff}.login-card .add-button{width:100%;height:44px}.login-card small{color:#707683;text-align:center;font-size:11px}.login-error{color:#c83d4c;font-size:12px;margin:0;min-height:16px}</style>
</head>
<body class="login-page">
  <main class="login-card">
    <a class="brand" href="/loginadm"><span>✓</span> chamados</a>
    <div><p class="eyebrow">ÁREA RESTRITA</p><h1>Entrar no sistema</h1><p class="login-copy">Use suas credenciais para acessar seus chamados salvos no banco de dados.</p></div>
    <form id="loginForm"><label>Usuário<input id="username" autocomplete="username" required placeholder="Seu usuário"></label><label>Senha<input id="password" type="password" autocomplete="current-password" required placeholder="Sua senha"></label><p id="loginError" class="login-error"></p><button class="add-button" type="submit">Entrar →</button></form>
  </main>
  <script>document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const error=document.getElementById('loginError');error.textContent='';const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});const data=await response.json();if(!response.ok){error.textContent=data.error;return}location.href=data.user.role==='admin'?'/admin':'/'}</script>
</body></html>
